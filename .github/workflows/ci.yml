name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, imports, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The `terminal` extra is not optional here any more: F07 made the Terminal Surface the
      # default `TOURGANIZE_SURFACE`, and the tests that cover it import textual. The base
      # install stays dependency-free — that is what the container job below still proves for
      # every command that does not need a terminal.
      - name: Install
        id: install
        run: pip install -e ".[dev,terminal]"

      # `if: !cancelled()` on every gate below: they are independent, so one run reports all
      # four verdicts instead of stopping at the first. The job still fails if any of them
      # did. `scripts/check` is the same idea locally, in parallel.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check .

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .

      - name: Types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy --strict tourganize

      # The architectural gate. A failure here is a design regression, not a lint nit:
      # see docs/architecture/decisions.md before touching a contract.
      - name: Import boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: lint-imports

      # Coverage is asked for here rather than in `addopts`, so that the edit/check loop
      # does not pay for instrumentation nothing gates on.
      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest --cov=tourganize --cov-report=term-missing

  container:
    name: build the app image and run doctor in it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker compose --profile dev-cpu build

      - name: Doctor
        run: docker compose --profile dev-cpu run --rm app tourganize doctor

      # The shipped Component Catalog and its Requirement Schemas have to load inside the
      # image, not only in a checkout.
      - name: Validate the shipped catalog and schemas
        run: docker compose --profile dev-cpu run --rm app tourganize catalog validate

      - name: Report the gaps of a shipped Component Kind
        run: docker compose --profile dev-cpu run --rm app tourganize catalog gaps --kind lodging

      # The Phase 1 demo, headless. `run -T` allocates **no** TTY, which is deliberate: the
      # interactive demo is `docker compose --profile dev-cpu run --rm app tourganize chat`
      # and needs a terminal, CI has none, and the Scripted Surface is the whole answer to
      # that. If these two steps pass, `--script` never needed one.
      - name: Replay the Phase 1 conversation headlessly
        run: >
          docker compose --profile dev-cpu run --rm -T app
          tourganize chat --script fixtures/conversations/paris.txt

      # Hebrew, on the same day the surface exists rather than retrofitted: the RTL path has
      # to survive a whole session, which is all this asserts (F10 makes it *look* right).
      - name: Replay the same conversation in Hebrew
        run: >
          docker compose --profile dev-cpu run --rm -T app
          tourganize chat --locale he --script fixtures/conversations/paris.he.txt

      - name: Confirm the container runs as a non-root user
        run: docker compose --profile dev-cpu run --rm app id -u | grep -qx 10001
