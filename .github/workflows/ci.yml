name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, imports, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        id: install
        run: pip install -e ".[dev]"

      # `if: !cancelled()` on every gate below: they are independent, so one run reports all
      # four verdicts instead of stopping at the first. The job still fails if any of them
      # did. `scripts/check` is the same idea locally, in parallel.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check .

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .

      - name: Types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy --strict tourganize

      # The architectural gate. A failure here is a design regression, not a lint nit:
      # see docs/architecture/decisions.md before touching a contract.
      - name: Import boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: lint-imports

      # Coverage is asked for here rather than in `addopts`, so that the edit/check loop
      # does not pay for instrumentation nothing gates on.
      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest --cov=tourganize --cov-report=term-missing

  container:
    name: build the app image and run doctor in it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker compose --profile dev-cpu build

      - name: Doctor
        run: docker compose --profile dev-cpu run --rm app tourganize doctor

      # The shipped Component Catalog and its Requirement Schemas have to load inside the
      # image, not only in a checkout.
      - name: Validate the shipped catalog and schemas
        run: docker compose --profile dev-cpu run --rm app tourganize catalog validate

      - name: Report the gaps of a shipped Component Kind
        run: docker compose --profile dev-cpu run --rm app tourganize catalog gaps --kind lodging

      - name: Confirm the container runs as a non-root user
        run: docker compose --profile dev-cpu run --rm app id -u | grep -qx 10001
