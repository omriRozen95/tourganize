[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tourganize"
description = "A conversational trip-planning assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tourganize" }]
keywords = ["travel", "planning", "conversational", "hexagonal"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Typing :: Typed",
]
dynamic = ["version"]

# The base install is pure-Python and dependency-free on purpose: `tourganize doctor` must
# run in an image that pulls nothing. Every heavy stack lives in an extra, owned by the
# feature that needs it.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
]
terminal = ["textual>=0.79"]            # F07 — Terminal Surface
typeset = ["weasyprint>=62"]            # F14 — Typeset Renderer
mcp = ["fastmcp>=2.0"]                  # F15, F16 — Tool Broker and the local MCP service
knowledge = [                           # F18, F19 — ingestion and retrieval
  "pypdf>=4.3",
  "numpy>=1.26",
  "sentence-transformers>=3.0",
]
hosted = ["httpx>=0.27"]                # F20, F21 — the Model Service client

[project.scripts]
tourganize = "tourganize.cli:main"

[tool.setuptools.packages.find]
include = ["tourganize*"]

[tool.setuptools.package-data]
tourganize = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "tourganize.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude", "docs"]  # vendored skills and prose are not ours to lint

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# An en dash is not a confusable here, it is *input*: a traveller writes "23–28 October", and
# both the shipped phrase tables and the tests that drive them have to contain the character.
allowed-confusables = ["\u2013"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private parsers deliberately and import fixtures by fixture name.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["tourganize"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `tests` is on the path so that a test module can import the shared helpers next to it
# (`conftest.write_catalog`, `boundaries`) without depending on pytest's import mode.
pythonpath = [".", "tests"]
# Coverage is deliberately *not* here. It is instrumentation, nothing gates on it
# (there is no --cov-fail-under), and it roughly doubles the cost of the single-file runs
# that dominate an edit/check loop. CI and `scripts/check --cov` ask for it explicitly.
addopts = "-ra --strict-markers"
markers = [
  # Registered here, not only by pytest-xdist, so that --strict-markers still passes in an
  # environment that installed pytest without it. tests/architecture/ carries the marker
  # because those tests plant a file in the real tree: see scripts/check.
  "xdist_group: pin a test to one xdist worker, by group name",
]

[tool.coverage.run]
branch = true
source = ["tourganize"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# --------------------------------------------------------------------------------------
# import-linter: the mechanical enforcement of the DDD boundary (C2).
#
# These contracts are not tooling hygiene — they are the reason the domain stays
# replaceable. Weakening one requires an entry in docs/architecture/decisions.md, not a
# config tweak. tests/architecture/ proves they reject a real violation.
# --------------------------------------------------------------------------------------
[tool.importlinter]
root_package = "tourganize"
# Required so that a third-party import inside the domain is a visible edge in the graph
# rather than an invisible one. Without it, contract 1 below can only see internal modules.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The domain imports only the standard library and itself"
type = "forbidden"
source_modules = ["tourganize.domain"]
# Both halves matter. The internal half keeps the domain off the platform *and* off the ports;
# the external half keeps a third-party library out of it. Every distribution named in
# [project.optional-dependencies] belongs in the list below — adding an extra without adding
# its import name here silently narrows this contract.
# tests/architecture/test_import_boundaries.py checks the same rule exhaustively, by AST, so
# a library nobody thought to list is still caught.
forbidden_modules = [
  "tourganize.adapters",
  "tourganize.application",
  "tourganize.cli",
  "tourganize.language",
  "tourganize.platform",
  "tourganize.ports",
  "fastmcp",
  "httpx",
  "numpy",
  "pypdf",
  "sentence_transformers",
  "textual",
  "weasyprint",
]

# The dialogue gets one permission the domain does not: `tourganize.ports`. The Dialogue
# Director's constructor names four port types, and the two protocols it introduces are typed
# with Dialogue value objects — see D17 in docs/architecture/decisions.md. The contract below
# keeps that permission from meaning anything more: `tourganize.ports` itself imports only the
# standard library, the domain and the dialogue, so the dialogue still reaches nothing external.
[[tool.importlinter.contracts]]
name = "The dialogue imports only the standard library, the domain and the ports"
type = "forbidden"
source_modules = ["tourganize.dialogue"]
forbidden_modules = [
  "tourganize.adapters",
  "tourganize.application",
  "tourganize.cli",
  "tourganize.language",
  "tourganize.platform",
  "fastmcp",
  "httpx",
  "numpy",
  "pypdf",
  "sentence_transformers",
  "textual",
  "weasyprint",
]

[[tool.importlinter.contracts]]
name = "Ports never import adapters, and stay as pure as what they carry"
type = "forbidden"
source_modules = ["tourganize.ports"]
forbidden_modules = [
  "tourganize.adapters",
  "tourganize.application",
  "tourganize.cli",
  "tourganize.language",
  "tourganize.platform",
  "fastmcp",
  "httpx",
  "numpy",
  "pypdf",
  "sentence_transformers",
  "textual",
  "weasyprint",
]

# One adapter never reaches into another: an adapter that did could not be swapped out on its
# own, which is the whole point of the layout. F06's Definition of done names this rule for
# `tourganize.adapters.options` in particular — the Fixture Provider, the registry and the
# ranking must not import `tourganize.adapters.presentation` or any other adapter package —
# and it is enforced here for every pair, not only that one.
# tests/architecture/test_import_boundaries.py checks the same rule by AST, both directions.
[[tool.importlinter.contracts]]
name = "Adapter sub-packages are independent of each other"
type = "independence"
modules = [
  "tourganize.adapters.catalog",
  "tourganize.adapters.clock",
  "tourganize.adapters.interpretation",
  "tourganize.adapters.options",
  "tourganize.adapters.presentation",
  "tourganize.adapters.telemetry",
]

# CLAUDE.md: "Adapters are selected from Settings in exactly one place:
# tourganize/application/composition.py." tourganize.cli is a source module here, not an
# exemption: it reaches adapters through build_container like everything else.
[[tool.importlinter.contracts]]
name = "Only the Composition Root imports adapters"
type = "forbidden"
source_modules = [
  "tourganize.application",
  "tourganize.cli",
  "tourganize.dialogue",
  "tourganize.domain",
  "tourganize.language",
  "tourganize.platform",
  "tourganize.ports",
]
forbidden_modules = ["tourganize.adapters"]
ignore_imports = ["tourganize.application.composition -> tourganize.adapters.**"]
unmatched_ignore_imports_alerting = "warn"
