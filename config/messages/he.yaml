# The Message Catalogue for Hebrew.
#
# Hebrew is a first-class *content* language, and this file is where a surface stops being an
# English one. See en.yaml for the key conventions; this file only differs in what it says.
#
# Two honest caveats, both of which F10 owns rather than this file. The wording here is
# provisional — F10 is the feature that reviews it against real Hebrew usage. And `direction:
# rtl` is *plumbed* from here to RenderedAct.direction and no further: bidi shaping, mixed
# English/Hebrew runs and locale-aware dates and numbers are all F10's, so a slate rendered
# here will read in logical order and may not yet *look* right in a terminal. What this file
# guarantees today is the thing F07 promises: Hebrew renders, every Act, without an exception.
locale: he
direction: rtl

